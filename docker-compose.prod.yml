services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8010}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./data:/srv/data

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:80"
    depends_on: [api]

volumes:
  pgdata:
