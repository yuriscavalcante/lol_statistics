name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen pytest
        working-directory: apps/api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: lol_statistics
    steps:
      - name: ssh deploy
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "${PORT:-22}" \
            "$USER@$HOST" \
            'cd /opt/riot-statistics && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build'
